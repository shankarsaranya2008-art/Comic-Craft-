{% extends "base.html" %}


{% block content %}

<section class="success card">

    <div class="success-icon">
        ✓
    </div>


    <p class="eyebrow">
        EXPORT COMPLETE
    </p>


    <h1>
        Your comic is ready.
    </h1>


    <p>
        The PDF has been prepared successfully.
    </p>


    {% if filename %}

    <a
        class="primary button"
        href="/download/{{ filename }}"
    >
        Download PDF
    </a>

    {% endif %}


    <a
        class="secondary button"
        href="/"
    >
        Go Create Another Comic
    </a>

</section>

{% endblock %}
